<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('/static/images/image.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>

<body class="bg-gray-100 font-sans">
    <!-- Navigation Bar -->
    <nav class="bg-gray-800 text-white shadow-md sticky top-0 z-10">
        <div class="container mx-auto flex items-center justify-between p-4">
            <div class="text-2xl font-bold">
                <a href="/" class="hover:text-gray-300">My Portfolio</a>
            </div>
            <ul class="flex space-x-4">
                <li><a href="/" class="hover:text-gray-300">Home</a></li>
                <li><a href="/profile" class="hover:text-gray-300">Profile</a></li>
                <li><a href="/edit-profile" class="hover:text-gray-300">Edit Profile</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto p-8 flex flex-col lg:flex-row items-center">
        <!-- Profile Picture and Upload Form -->
        <div class="lg:w-1/3 mb-8 lg:mb-0 text-center">
            <img src="{{ profile.picture }}" alt="Profile Picture" class="w-48 h-48 object-cover rounded-full mx-auto">
            <form action="/upload-profile-picture" method="post" enctype="multipart/form-data" class="mt-4">
                <input type="file" name="profile_picture" accept="image/*">
                <button type="submit" class="mt-2 bg-blue-500 text-white py-2 px-4 rounded">Upload</button>
            </form>
        </div>

        <!-- Profile Details -->
        <div class="lg:w-2/3 lg:ml-8">
            <h1 class="text-3xl font-bold mb-4">Profile Details</h1>
            <p class="text-lg text-white-800"><strong>Name:</strong> {{ profile.name }}</p>
            <p class="text-lg text-white-800"><strong>Age:</strong> {{ profile.age }}</p>
            <p class="text-lg text-white-800"><strong>Grade/Class:</strong> {{ profile.grade }}</p>
            <p class="text-lg text-white-800"><strong>Contact:</strong> {{ profile.contact }}</p>

            <div class="mt-6">
                <a href="/edit-profile" class="bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 transition-colors">Edit Profile</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center py-4 mt-8">
        <p class="text-sm">&copy; 2024 Student Portfolio System | All rights reserved.</p>
        <div class="mt-2">
            <a href="#" class="hover:text-gray-300 text-sm">Privacy Policy</a>
            <span class="mx-2">|</span>
            <a href="#" class="hover:text-gray-300 text-sm">Terms of Service</a>
        </div>
    </footer>
</body>

</html>
