<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            background-image: url('/static/images/image.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        main {
            flex: 1;
        }
    </style>
</head>

<body class="bg-gray-100 font-sans">
    <!-- Navigation Bar -->
    <nav class="bg-gray-800 text-white shadow-md sticky top-0 z-10">
        <div class="container mx-auto flex items-center justify-between p-4">
            <div class="text-2xl font-bold">
                <a href="/" class="hover:text-gray-300">My Portfolio</a>
            </div>
            <ul class="flex space-x-4">
                <li><a href="/" class="hover:text-gray-300">Home</a></li>
                <li><a href="/profile" class="hover:text-gray-300">Profile</a></li>
                <li><a href="/edit-profile" class="hover:text-gray-300">Edit Profile</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto p-8">
        <h1 class="text-3xl font-bold mb-4 text-center">Edit Profile</h1>

        <div class="bg-white p-8 rounded-lg shadow-lg mx-auto max-w-md">
            <form action="/edit-profile" method="post">
                <div class="mb-4">
                    <label for="name" class="block text-lg font-semibold text-gray-700 mb-2">Name</label>
                    <input type="text" id="name" name="name" value="{{ profile.name }}" class="w-full p-2 border border-gray-300 rounded" required>
                </div>
                <div class="mb-4">
                    <label for="age" class="block text-lg font-semibold text-gray-700 mb-2">Age</label>
                    <input type="number" id="age" name="age" value="{{ profile.age }}" class="w-full p-2 border border-gray-300 rounded" required>
                </div>
                <div class="mb-4">
                    <label for="grade" class="block text-lg font-semibold text-gray-700 mb-2">Grade/Class</label>
                    <input type="text" id="grade" name="grade" value="{{ profile.grade }}" class="w-full p-2 border border-gray-300 rounded" required>
                </div>
                <div class="mb-4">
                    <label for="contact" class="block text-lg font-semibold text-gray-700 mb-2">Contact</label>
                    <input type="text" id="contact" name="contact" value="{{ profile.contact }}" class="w-full p-2 border border-gray-300 rounded" required>
                </div>
                <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 transition-colors">Save Changes</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center py-4 mt-8">
        <p class="text-sm">&copy; 2024 Student Portfolio System | All rights reserved.</p>
        <div class="mt-2">
            <a href="#" class="text-gray-400 hover:text-gray-300 text-sm">Privacy Policy</a>
            <span class="mx-2">|</span>
            <a href="#" class="text-gray-400 hover:text-gray-300 text-sm">Terms of Service</a>
        </div>
    </footer>
</body>

</html>
